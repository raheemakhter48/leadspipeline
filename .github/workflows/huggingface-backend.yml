name: Deploy backend to Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      backend_path:
        description: Backend folder to upload to the Hugging Face Space
        required: true
        default: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Validate backend folder
        run: |
          if [ ! -d "${{ inputs.backend_path }}" ]; then
            echo "Backend folder '${{ inputs.backend_path }}' was not found."
            echo "Create a backend service folder first, then rerun this workflow."
            exit 1
          fi

      - name: Upload backend to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python -m huggingface_hub upload \
            "$HF_SPACE_ID" \
            "${{ inputs.backend_path }}" \
            . \
            --repo-type space \
            --token "$HF_TOKEN" \
            --delete="*" \
            --commit-message "Deploy backend from GitHub Actions"
