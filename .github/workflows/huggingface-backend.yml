name: Deploy backend to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/huggingface-backend.yml"
  workflow_dispatch:
    inputs:
      backend_path:
        description: Backend folder to upload to the Hugging Face Space
        required: true
        default: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_PATH: ${{ github.event.inputs.backend_path || 'backend' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Check Hugging Face secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN" || (echo "Missing GitHub secret: HF_TOKEN" && exit 1)
          test -n "$HF_SPACE_ID" || (echo "Missing GitHub secret: HF_SPACE_ID" && exit 1)

      - name: Validate backend folder
        run: |
          if [ ! -d "$BACKEND_PATH" ]; then
            echo "Backend folder '$BACKEND_PATH' was not found."
            echo "Create a backend service folder first, then rerun this workflow."
            exit 1
          fi

      - name: Upload backend to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import upload_folder

          upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              folder_path=os.environ["BACKEND_PATH"],
              path_in_repo=".",
              repo_type="space",
              token=os.environ["HF_TOKEN"],
              delete_patterns=["*"],
              commit_message="Deploy backend from GitHub Actions",
          )
          PY
